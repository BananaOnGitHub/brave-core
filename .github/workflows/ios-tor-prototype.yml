name: iOS Tor prototype
on:
  pull_request:
    paths: ["ios/tor/**", ".github/workflows/ios-tor-prototype.yml"]
  workflow_dispatch:

concurrency:
  group: ios-tor-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'BananaOnGitHub/brave-core'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          sparse-checkout: ios/tor
          persist-credentials: false
      - name: Test embedded runtime and protocol without the Tor network
        working-directory: ios/tor
        run: swift test
      - name: Generate lightweight device harness
        working-directory: ios/tor/Harness
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Test native WebKit protections
        timeout-minutes: 10
        working-directory: ios/tor/Harness
        run: |
          # Work around WebKit bug 293831 in Xcode 16.4/iOS 18.5 simulator only.
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v.get("isAvailable") and v["name"].startswith("iPhone")))')
          xcodebuild -project BraveTorPrototype.xcodeproj -scheme BraveTorPrototype -destination "platform=iOS Simulator,id=$simulator_id" -derivedDataPath ../.build/ios CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=18.4 -parallel-testing-enabled NO test
      - name: Archive and validate unsigned Release device app
        working-directory: ios/tor/Harness
        run: |
          xcodebuild -project BraveTorPrototype.xcodeproj -scheme BraveTorPrototype -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ../.build/harness -archivePath ../.build/BraveTorPrototype.xcarchive CODE_SIGNING_ALLOWED=NO archive
          python3 package_ipa.py ../.build/BraveTorPrototype.xcarchive/Products/Applications/BraveTorPrototype.app ../.build/package
      - name: Upload IPA directly
        id: upload_ipa
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ios/tor/.build/package/BraveTorPrototype-unsigned.ipa
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload package report separately
        id: upload_report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ios/tor/.build/package/package-report.json
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Link direct downloads
        env:
          IPA_URL: ${{ steps.upload_ipa.outputs.artifact-url }}
          REPORT_URL: ${{ steps.upload_report.outputs.artifact-url }}
        run: |
          printf '[Download unsigned IPA](%s)\n\n[Package report](%s)\n' "$IPA_URL" "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
