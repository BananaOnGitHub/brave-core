name: iOS Tor prototype
on:
  pull_request:
    paths: ["ios/tor/**", "ios/brave-ios/**", ".github/workflows/ios-tor-prototype.yml"]
  workflow_dispatch:

concurrency:
  group: ios-tor-integration-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'BananaOnGitHub/brave-core'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          sparse-checkout: |
            ios/tor
            ios/brave-ios/Sources/Web
            ios/brave-ios/Sources/BraveStrings
            ios/brave-ios/Sources/Brave/Frontend/Browser
          persist-credentials: false
      - name: Test embedded runtime and protocol without the Tor network
        working-directory: ios/tor
        run: swift test
      - name: Parse Brave tab integration sources
        run: |
          xcrun swiftc -frontend -parse ios/brave-ios/Sources/Web/WebKit/TorTabState.swift ios/brave-ios/Sources/Brave/Frontend/Browser/TabManager.swift ios/brave-ios/Sources/Brave/Frontend/Browser/Tabs/TabGrid/TabGridViewModel.swift ios/brave-ios/Sources/Brave/Frontend/Browser/Tabs/TabGrid/TabGridView.swift
      - name: Generate lightweight device harness
        working-directory: ios/tor/Harness
        run: |
          python3 -m unittest -v test_strip_static_tor_bundle.py
          brew install xcodegen
          xcodegen generate
      - name: Boot iOS simulator
        timeout-minutes: 4
        run: |
          simulator_runtime="com.apple.CoreSimulator.SimRuntime.iOS-$(xcrun --sdk iphonesimulator --show-sdk-version | tr '.' '-')"
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for v in d["devices"][sys.argv[1]] if v.get("isAvailable") and v["name"].startswith("iPhone")))' "$simulator_runtime")
          echo "TOR_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          simulator_state=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["state"] for vs in d["devices"].values() for v in vs if v["udid"] == sys.argv[1]))' "$simulator_id")
          if [ "$simulator_state" = "Shutdown" ]; then
            xcrun simctl boot "$simulator_id"
          fi
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Test native WebKit protections
        timeout-minutes: 10
        working-directory: ios/tor/Harness
        run: |
          xcodebuild -project BraveTorPrototype.xcodeproj -scheme BraveTorPrototype -destination "platform=iOS Simulator,id=$TOR_SIMULATOR_ID" -derivedDataPath ../.build/ios CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -resultBundlePath ../.build/TorPrototypeTests.xcresult test
      - name: Summarize native test results
        if: always()
        continue-on-error: true
        working-directory: ios/tor/Harness
        run: |
          if [ -d ../.build/TorPrototypeTests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path ../.build/TorPrototypeTests.xcresult
          fi
      - name: Save native test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Native-test-results
          path: ios/tor/.build/TorPrototypeTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive and validate unsigned Release device app
        working-directory: ios/tor/Harness
        run: |
          xcodebuild -project BraveTorPrototype.xcodeproj -scheme BraveTorPrototype -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ../.build/harness -archivePath ../.build/BraveTorPrototype.xcarchive CODE_SIGNING_ALLOWED=NO archive
          python3 package_ipa.py ../.build/BraveTorPrototype.xcarchive/Products/Applications/BraveTorPrototype.app ../.build/package
      - name: Upload IPA directly
        id: upload_ipa
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ios/tor/.build/package/BraveTorPrototype-unsigned.ipa
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload package report separately
        id: upload_report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ios/tor/.build/package/package-report.json
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Link direct downloads
        env:
          IPA_URL: ${{ steps.upload_ipa.outputs.artifact-url }}
          REPORT_URL: ${{ steps.upload_report.outputs.artifact-url }}
        run: |
          printf '[Download unsigned IPA](%s)\n\n[Package report](%s)\n' "$IPA_URL" "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
