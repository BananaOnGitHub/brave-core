name: BraveTorPrototype
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  BraveTor:
    path: ..
targets:
  BraveTorPrototype:
    type: application
    platform: iOS
    sources:
      - App.swift
    dependencies:
      - package: BraveTor
        product: BraveTorUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banana.brave.tor-prototype
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.0"
        ENABLE_DEBUG_DYLIB: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: GeneratedInfo.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        UILaunchScreen: {}
  BraveTorPrototypeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../Tests/BraveTorUITests
    dependencies:
      - target: BraveTorPrototype
      - package: BraveTor
        product: BraveTorUI
      - package: BraveTor
        product: BraveTor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banana.brave.tor-prototype.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  BraveTorPrototype:
    build:
      targets:
        BraveTorPrototype: all
    test:
      targets:
        - BraveTorPrototypeTests
