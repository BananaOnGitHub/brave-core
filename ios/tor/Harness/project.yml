name: BraveTorPrototype
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  BraveTor:
    path: ..
targets:
  BraveTorPrototype:
    type: application
    platform: iOS
    sources:
      - App.swift
    dependencies:
      - package: BraveTor
        product: BraveTorUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banana.brave.tor-prototype
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "6"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.0"
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    postBuildScripts:
      - name: Remove redundant static Tor bundle
        script: python3 "$SRCROOT/strip_static_tor_bundle.py" "$TARGET_BUILD_DIR/$WRAPPER_NAME"
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
          - "$(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)"
        basedOnDependencyAnalysis: false
    info:
      path: GeneratedInfo.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        UILaunchScreen: {}
  BraveTorPrototypeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../Tests/BraveTorUITests
      - TabContracts/Tests
    dependencies:
      - target: BraveTorPrototype
      - target: WebTabContracts
      - target: ContractBraveCore
      - target: ContractBraveStrings
      - target: ContractFaviconModels
      - package: BraveTor
        product: BraveTorUI
      - package: BraveTor
        product: BraveTor
      - package: BraveTor
        product: TorWebKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banana.brave.tor-prototype.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Remove redundant static Tor bundle
        script: python3 "$SRCROOT/strip_static_tor_bundle.py" "$TARGET_BUILD_DIR/$WRAPPER_NAME"
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
          - "$(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)"
        basedOnDependencyAnalysis: false
  ContractBraveCore:
    type: library.static
    platform: iOS
    sources: [TabContracts/BraveCore]
    settings:
      base:
        PRODUCT_MODULE_NAME: BraveCore
        DEFINES_MODULE: YES
        SWIFT_VERSION: "5.0"
  ContractFaviconModels:
    type: library.static
    platform: iOS
    sources: [TabContracts/FaviconModels]
    settings:
      base:
        PRODUCT_MODULE_NAME: FaviconModels
        DEFINES_MODULE: YES
        SWIFT_VERSION: "5.0"
  ContractBraveStrings:
    type: library.static
    platform: iOS
    sources:
      - TabContracts/BraveStrings
      - ../../brave-ios/Sources/BraveStrings/BraveStrings+Tor.swift
    settings:
      base:
        PRODUCT_MODULE_NAME: BraveStrings
        DEFINES_MODULE: YES
        SWIFT_VERSION: "5.0"
  WebTabContracts:
    type: library.static
    platform: iOS
    sources:
      - TabContracts/Generated
      - TabContracts/Web
      - ../../brave-ios/Sources/Web/WebKit/TorTabState.swift
      - ../../brave-ios/Sources/Web/WebKit/SafeJavaScript.swift
      - ../../brave-ios/Sources/Web/TabObserver.swift
      - ../../brave-ios/Sources/Web/TabDelegate.swift
      - ../../brave-ios/Sources/Web/TabDownloadDelegate.swift
      - ../../brave-ios/Sources/Web/TabPolicyDecider.swift
    dependencies:
      - target: ContractBraveCore
      - target: ContractFaviconModels
      - target: ContractBraveStrings
      - package: BraveTor
        product: BraveTorUI
      - package: BraveTor
        product: BraveTor
    settings:
      base:
        DEFINES_MODULE: YES
        SWIFT_VERSION: "5.0"
        # Xcode does not add transitive SwiftPM Clang module maps to static
        # library targets. The application/test bundle receives these normally.
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../Sources/TorWebKit/include $(SRCROOT)/../Sources/EmbeddedTor/include"
        OTHER_SWIFT_FLAGS: >-
          $(inherited)
          -Xcc -fmodule-map-file=$(OBJROOT)/GeneratedModuleMaps$(EFFECTIVE_PLATFORM_NAME)/TorWebKit.modulemap
          -Xcc -fmodule-map-file=$(OBJROOT)/GeneratedModuleMaps$(EFFECTIVE_PLATFORM_NAME)/EmbeddedTor.modulemap
          -enable-upcoming-feature DisableOutwardActorInference
          -enable-upcoming-feature GlobalActorIsolatedTypesUsability
          -enable-upcoming-feature InferIsolatedConformances
          -enable-upcoming-feature InferSendableFromCaptures
          -enable-upcoming-feature NonisolatedNonsendingByDefault
schemes:
  BraveTorPrototype:
    build:
      targets:
        BraveTorPrototype: all
    test:
      targets:
        - BraveTorPrototypeTests
